# Generated by `paws workflow generate` — https://github.com/mbround18/paws
name: paws

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  paws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mbround18/paws/actions/paws-up@main

      # `paws ci` provisions a host toolchain for every ecosystem it detects in
      # the repo, not just --toolchain's. This repo has a pyproject.toml, so the
      # rust build also provisions python, which shells out to `uv`. The runner
      # ships rustup but not uv, so without this every `paws ci` step fails
      # before it starts.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # `paws ci --toolchain rust` runs in a bare rust:1-bookworm container with
      # no system packages, so it cannot build this project: libopus_sys and
      # whisper-rs-sys need cmake, clang and pkg-config — the same packages this
      # repo's own Dockerfile installs. paws exposes no way for a consumer repo
      # to add them (its --coverage builder image doesn't carry them either), so
      # the Rust gates run natively here. Same four checks paws would have run,
      # plus --locked.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev clang libclang-dev cmake

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --verbose

      - run: paws ci --toolchain python

      # Pushes on a push to main or a tag; other builds are build-only unless
      # the PR carries the `canary` label.
      #
      # PR label names are attacker-controlled on a fork PR, so they reach the
      # command through the environment instead of being interpolated into the
      # run script. On a non-PR event `join` yields an empty string.
      - run: >
          paws docker
          --image ghcr.io/mbround18/hammock
          --with-latest --tag-rollup --tag-branch --tag-pr
          --labels "$PAWS_PR_LABELS"
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          PAWS_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
