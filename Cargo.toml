[package]
name = "hammock"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
] }
dashmap = "6.2.1"
serenity = { version = "0.12.5", default-features = false, features = [
    "cache",
    "client",
    "gateway",
    "model",
    "rustls_backend",
    "voice",
] }
songbird = { version = "0.6.0", default-features = false, features = [
    "driver",
    "gateway",
    "receive",
    "serenity",
    "rustls",
    "tungstenite",
] }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "fs",
    "sync",
    "process",
    "io-util",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
whisper-rs = { version = "0.15.1", default-features = false }
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
poise = "0.7.0"
dotenvy = "0.15.7"
which = "8.0.6"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "stream",
    "multipart",
    "json",
] }
futures-util = "0.3.34"
serde = "1.0.229"
serde_json = "1.0.151"
symphonia = { version = "0.6.0", default-features = false, features = [
    "mpa",
    "mp3",
] }
actix-web = { version = "4.15.0", default-features = false, features = [
    "macros",
] }

[features]
default = []
cuda = ["whisper-rs/cuda"]

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
